name: Build Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    uses: ybojko/voting-app-ci/.github/workflows/build.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      service-name: worker
      context: worker
      platforms: linux/amd64,linux/arm64
    secrets:
      GIT_OPS_TOKEN: ${{ secrets.GIT_OPS_TOKEN }}
