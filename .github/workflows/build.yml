name: Build Worker

on:
  push:
    branches:
      - master
    paths:
      - "**"
  pull_request:
    branches:
      - master

jobs:
  build:
    uses: ybojko/voting-app-ci/.github/workflows/build.yml@master
    permissions:
      contents: read
    with:
      image_name: worker
      context: .
      platforms: linux/amd64,linux/arm64
    secrets:
      GIT_OPS_TOKEN: ${{ secrets.GIT_OPS_TOKEN }}
